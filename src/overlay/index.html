<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #cat {
      display: block;
      cursor: grab;
      user-select: none;
      image-rendering: auto;
      transform-origin: bottom center;
    }
    #cat:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="cat"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
