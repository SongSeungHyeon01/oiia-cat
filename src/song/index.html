<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Set Song</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e1e;
      color: #eee;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      gap: 12px;
    }
    label { font-size: 13px; color: #aaa; align-self: flex-start; }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2c2c2c;
      color: #eee;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #666; }
    .buttons { display: flex; gap: 8px; width: 100%; }
    button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    #btnApply { background: #4a9eff; color: #fff; }
    #btnApply:hover { background: #3a8eef; }
    #btnReset { background: #444; color: #ccc; }
    #btnReset:hover { background: #555; }
    #status { font-size: 12px; color: #aaa; min-height: 16px; }
    #status.error { color: #f77; }
    #status.ok { color: #7f7; }
  </style>
</head>
<body>
  <label>YouTube URL</label>
  <input id="urlInput" type="text" placeholder="https://www.youtube.com/watch?v=..." />
  <div class="buttons">
    <button id="btnApply">Apply</button>
    <button id="btnReset">Reset (oiia)</button>
  </div>
  <div id="status"></div>
  <script src="song.js"></script>
</body>
</html>
